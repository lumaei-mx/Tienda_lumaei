<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <rect width="400" height="280" fill="#F7F2EA"/>
  <!-- le monogram oval -->
  <ellipse cx="200" cy="72" rx="48" ry="36" stroke="#C4A35A" stroke-width="2.2" fill="none"/>
  <text x="200" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-style="italic" fill="#A68B4B">le</text>
  <!-- stars -->
  <g fill="#C4A35A">
    <path d="M268 48 l2.2 6.8 h7.2 l-5.8 4.2 2.2 6.8-5.8-4.2-5.8 4.2 2.2-6.8-5.8-4.2 h7.2z"/>
    <path d="M286 62 l1.4 4.2 h4.4 l-3.6 2.6 1.4 4.2-3.6-2.6-3.6 2.6 1.4-4.2-3.6-2.6 h4.4z" opacity="0.85"/>
    <path d="M278 78 l1 3 h3.2 l-2.6 1.9 1 3-2.6-1.9-2.6 1.9 1-3-2.6-1.9 h3.2z" opacity="0.7"/>
  </g>
  <!-- lumaei wordmark -->
  <text x="200" y="155" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#3D2B1F" letter-spacing="2">lumaei</text>
  <!-- divider with star -->
  <line x1="110" y1="185" x2="178" y2="185" stroke="#C4A35A" stroke-width="1.2"/>
  <path d="M200 178 l2 6 h6.5 l-5.2 3.8 2 6.2-5.3-3.9-5.3 3.9 2-6.2-5.2-3.8 h6.5z" fill="#C4A35A"/>
  <line x1="222" y1="185" x2="290" y2="185" stroke="#C4A35A" stroke-width="1.2"/>
  <!-- tagline -->
  <text x="200" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C4A35A" letter-spacing="6">TIENDA ONLINE</text>
</svg>

          - generic [ref=f2e118]: "Running late to work while your cat stares from the door? This gravity feeder solves the root problem: it stores dry food in its upper reservoir and releases it automatically into the bowl as your pet eats. No internet, no batteries, no apps. Just fill the reservoir when it empties and your pet has food available all day. The bowl is stainless steel, which prevents odors, stains and the bacteria buildup you get with low-quality plastics. It's easy to take apart and clean. Its base is stable and non-slip: your pet eats calmly without the feeder moving. Ideal for dry food (kibble) for dogs and cats. Available in several sizes and colors."
